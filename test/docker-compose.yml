services:
  firestore:
    image: google/cloud-sdk:latest
    command: gcloud emulators firestore start --host-port=0.0.0.0:8081
    ports:
      - "8081:8080"  # Expose the REST port as 8081
      - "4000:4000"  # Expose the web interface port as 4000
  rabbitmq:
    image: rabbitmq:3
    ports: [ "5672:5672" ]
  minio:
    image: minio/minio
    command: server /data
    ports: [ "9000:9000" ]
  sftp:
    image: lscr.io/linuxserver/openssh-server
    container_name: sftp-server
    ports: [ "2222:2222" ]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./test-files:/home/testuser

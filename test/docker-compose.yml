services:
  # Database options - use either Firestore or MongoDB
  #firestore:
  #  image: google/cloud-sdk
  #  container_name: firestore
  #  command: gcloud emulators firestore start --host-port=0.0.0.0:8081
  #  ports: [ "8081:8080" ]  # Expose the REST port as 8081

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./mongodb-data:/data/db

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686" # UI port
      - "14250:14250" # Model port
      - "14268:14268"
      - "14269:14269"
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
  rabbitmq:
    image: rabbitmq:management
    container_name: queue
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=pass123
    ports:
      - "5672:5672"
      - "15672:15672"
  ollama:
    image: ollama/ollama
    container_name: ollama
    entrypoint: ["/start-ollama.sh"]
    volumes:
      - ./ollama:/root/.ollama
      - ./config/start-ollama.sh:/start-ollama.sh
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    ports: [ "11434:11434" ]
  #ollama-webui:
  #  image: ghcr.io/open-webui/open-webui:ollama
  #  ports:
  #    - "3000:8080"
  #  extra_hosts:
  #    - "host.docker.internal:host-gateway"
  #  volumes:
  #    - ./ollama/ollama-webui:/app/backend/data
  #  restart: always
  minio:
    image: minio/minio
    container_name: s3-store
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=pass123
    volumes:
      - ./minio-data:/data
  sftp:
    image: lscr.io/linuxserver/openssh-server
    container_name: sftp
    ports: [ "2222:2222" ]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./test-files:/config/test-files
    restart: unless-stopped
    
  samba:
    image: dperson/samba
    container_name: samba
    ports:
      - "139:139"
      - "445:445"
    environment:
      - TZ=Etc/UTC
    command: >-
      -u "testuser;testpass" 
      -s "share;/mount;yes;no;yes;all;testuser;testuser"
      -s "public;/public;yes;no;yes;all;;;"
      -p
    volumes:
      - ./test-files:/mount
      - ./test-files:/public
networks:
  default:
    driver: bridge

services:
  firestore:
    image: google/cloud-sdk:latest
    container_name: firestore
    command: gcloud emulators firestore start --host-port=0.0.0.0:8081
    ports: [ "8081:8080" ]  # Expose the REST port as 8081
  rabbitmq:
    image: rabbitmq:3
    container_name: queue
    ports: [ "5672:5672" ]
  ollama:
    image: ollama/ollama
    container_name: ai
    command: ollama pull all-minilm
    ports: [ "11434:11434" ]
  minio:
    image: minio/minio
    container_name: s3-store
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - ./minio-data:/data
  sftp:
    image: lscr.io/linuxserver/openssh-server
    container_name: sftp
    ports: [ "2222:2222" ]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./test-files:/config/test-files
    restart: unless-stopped

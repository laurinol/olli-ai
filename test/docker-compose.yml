services:
  firestore:
    image: google/cloud-sdk
    container_name: firestore
    command: gcloud emulators firestore start --host-port=0.0.0.0:8081
    ports: [ "8081:8080" ]  # Expose the REST port as 8081
  #firebase:
  #  image: voraciousdev/firebase-tools
  #  container_name: firebase
  #  environment:
  #    - FIREBASE_PROJECT_ID=oll-ai-dev
  #    - FIREBASE_TOKEN=1//068JU-3UYUsxDCgYIARAAGAYSNwF-L9IreRBohSSM9uetNw82RNOA9o2eRO_P5xQk1bgqF6VP5RuTfGTDbDebgPBLTMkYqmh56JQ
  #  ports:
  #    - "4000:4000"  # UI port
  #    - "8080:8080"  # Firestore emulator port
  #    - "9099:9099"  # auth
  rabbitmq:
    image: rabbitmq:management
    container_name: queue
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=pass1234
    ports:
      - "5672:5672"
      - "15672:15672"
  ollama:
    image: ollama/ollama
    container_name: ollama
    entrypoint: ["/start-ollama.sh"]
    volumes:
      - ./ollama:/root/.ollama
      - ./config/start-ollama.sh:/start-ollama.sh
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    ports: [ "11434:11434" ]
  minio:
    image: minio/minio
    container_name: s3-store
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=pass1234
    volumes:
      - ./minio-data:/data
  sftp:
    image: lscr.io/linuxserver/openssh-server
    container_name: sftp
    ports: [ "2222:2222" ]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./test-files:/config/test-files
    restart: unless-stopped
networks:
  default:
    driver: bridge

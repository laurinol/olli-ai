services:
  firestore:
    image: google/cloud-sdk:latest
    command: gcloud emulators firestore start --host-port=0.0.0.0:8081
    ports: [ "8081:8081" ]
  rabbitmq:
    image: rabbitmq:3
    ports: [ "5672:5672" ]
  minio:
    image: minio/minio
    command: server /data
    ports: [ "9000:9000" ]
  sftp:
    image: lscr.io/linuxserver/openssh-server
    ports: [ "2222:22" ]
    environment:
      - USER_NAME=testuser
      - PASSWORD=testpass

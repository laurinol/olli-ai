openapi: 3.0.3
info:
  title: Olli-AI API
  description: REST API for Olli-AI, supporting authentication, document synchronization, and RAG-based chat functionality.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://olli-ai-2025.appspot.com
    description: Production server (GCP App Engine)
paths:
  /auth/health:
    get:
      summary: Health Check
      description: Checks if the application is running properly.
      responses:
        '200':
          description: Application is running
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
  
  /auth/invite:
    post:
      summary: Create Email Verification
      description: Creates a verification link for a user to verify their email during registration. Endpoint name maintained for backward compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                businessId:
                  type: string
              required:
                - email
                - businessId
      responses:
        '200':
          description: Verification created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Verification email sent"
        '400':
          description: Invalid request
        '500':
          description: Server error

  /auth/register:
    post:
      summary: Register User
      description: Registers a new user with email, password, and verification token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                token:
                  type: string
                  description: Verification token
              required:
                - email
                - password
                - token
      responses:
        '200':
          description: User registered successfully
          headers:
            Authorization:
              schema:
                type: string
                example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  userId:
                    type: string
        '400':
          description: Invalid request
        '409':
          description: User already exists
        '500':
          description: Registration failed

  /auth/login:
    post:
      summary: Login with Email/Password
      description: Authenticates a user with email and password, issues JWT if valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          headers:
            Authorization:
              schema:
                type: string
                example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  userId:
                    type: string
        '401':
          description: Invalid credentials
        '500':
          description: Login failed

  /health:
    get:
      summary: Health Check
      description: Checks if the application is running properly.
      responses:
        '200':
          description: Application is running
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /auth/profile:
    get:
      summary: Get User Profile
      description: Retrieves the authenticated user's profile information.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                    format: email
                  businessId:
                    type: string
                  role:
                    type: string
                    enum: [admin, user]
        '401':
          description: Unauthorized
        '500':
          description: Profile fetch failed

  /auth/google/callback:
    get:
      summary: Google OAuth Callback
      description: Handles Google OAuth callback, exchanges code for token, and issues JWT.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: businessId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful authentication
          headers:
            Authorization:
              schema:
                type: string
                example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userId:
                    type: string
        '401':
          description: Authentication failed

  /auth/facebook/callback:
    get:
      summary: Facebook OAuth Callback
      description: Handles Facebook OAuth callback, exchanges code for token, and issues JWT.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful authentication
          headers:
            Authorization:
              schema:
                type: string
        '401':
          description: Authentication failed

  /auth/x/callback:
    get:
      summary: X OAuth Callback
      description: Handles X OAuth 1.0a callback, exchanges tokens, and issues JWT.
      parameters:
        - name: oauth_token
          in: query
          required: true
          schema:
            type: string
        - name: oauth_verifier
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful authentication
          headers:
            Authorization:
              schema:
                type: string
        '401':
          description: Authentication failed

  /auth/microsoft/callback:
    get:
      summary: Microsoft OAuth Callback
      description: Handles Microsoft OAuth callback, exchanges code for token, and issues JWT.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful authentication
          headers:
            Authorization:
              schema:
                type: string
        '401':
          description: Authentication failed

  /auth/sync/{provider}:
    get:
      summary: Request Document Sync
      description: Initiates a synchronization task from the specified provider.
      security:
        - BearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [local, s3, dropbox, google-drive, onedrive, sftp, network]
        - name: folderId
          in: query
          required: true
          schema:
            type: string
        - name: businessId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sync request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  message:
                    type: string
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Sync request failed

  /auth/sync/status:
    get:
      summary: Check Sync Task Status
      description: Checks the status of a synchronization task.
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  status:
                    type: string
                    enum: [completed, failed, processing]
                  fileCount:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Task not found
        '500':
          description: Status check failed

  /chat/query:
    post:
      summary: Query LLM with Prompt and History
      description: Sends a chat query to the LLM, stores response in Firestore, requires authentication.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: Unauthorized
        '500':
          description: Query failed

  /chat/history:
    get:
      summary: Get Chat History
      description: Retrieves conversation history for the authenticated user from Firestore.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '401':
          description: Unauthorized
        '500':
          description: History fetch failed

  # Test endpoints (not available in production)
  /test-integration/get-latest-verification:
    get:
      summary: Get Latest Verification Token (Test Only)
      description: Retrieves the latest verification token for testing purposes. Not available in production.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification token
          content:
            text/plain:
              schema:
                type: string
                
  /test-integration/get-latest-invite:
    get:
      summary: Get Latest Invite Token (Test Only - Deprecated)
      description: Deprecated. Retrieves the latest verification token for testing purposes using old terminology. Not available in production.
      deprecated: true
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification token
          content:
            text/plain:
              schema:
                type: string

  /test/check-queue-task:
    get:
      summary: Check Queue Task (Test Only)
      description: Checks if a task exists in the queue. Not available in production.
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                  taskId:
                    type: string

  /test/process-sync-task:
    post:
      summary: Process Sync Task (Test Only)
      description: Manually processes a sync task. Not available in production.
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task processing result
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed:
                    type: boolean
                  taskId:
                    type: string

  /invitations:
    post:
      summary: Create Team Invitation
      description: Creates an invitation for a user to join a business team.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                businessId:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
              required:
                - email
                - businessId
                - role
      responses:
        '200':
          description: Invitation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                    format: email
                  businessId:
                    type: string
                  role:
                    type: string
                  sentBy:
                    type: string
                  message:
                    type: string
        '400':
          description: Invalid request
        '403':
          description: Not authorized to create invitations
        '500':
          description: Server error

    get:
      summary: Get Business Invitations
      description: Gets all invitations for a specific business.
      security:
        - BearerAuth: []
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '403':
          description: Not authorized to view invitations
        '500':
          description: Server error
  
  /invitations/pending:
    get:
      summary: Get Pending Invitations
      description: Gets all pending invitations for a specific business.
      security:
        - BearerAuth: []
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '403':
          description: Not authorized to view invitations
        '500':
          description: Server error
  
  /invitations/check:
    get:
      summary: Check Invitations for Email
      description: Checks if an email has any pending invitations.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: List of invitations for email
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    businessId:
                      type: string
                    role:
                      type: string
                    expiresAt:
                      type: integer
                      format: int64
        '400':
          description: Invalid request
        '500':
          description: Server error
  
  /invitations/{id}:
    get:
      summary: Get Invitation Details
      description: Gets details of a specific invitation.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '403':
          description: Not authorized to view invitation
        '404':
          description: Invitation not found
        '500':
          description: Server error
    
    delete:
      summary: Cancel Invitation
      description: Cancels (deletes) a specific invitation.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Not authorized to cancel invitation
        '404':
          description: Invitation not found
        '500':
          description: Server error
  
  /invitations/{id}/accept:
    post:
      summary: Accept Invitation
      description: Accepts an invitation to join a business team.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  businessId:
                    type: string
                  role:
                    type: string
        '400':
          description: Invalid request (expired invitation)
        '403':
          description: Not authorized to accept invitation
        '404':
          description: Invitation not found
        '500':
          description: Server error
  
  /invitations/{id}/resend:
    post:
      summary: Resend Invitation Email
      description: Resends the invitation email for a specific invitation.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation email resent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  email:
                    type: string
                    format: email
        '400':
          description: Invalid request (expired or accepted invitation)
        '403':
          description: Not authorized to resend invitation
        '404':
          description: Invitation not found
        '500':
          description: Server error

components:
  schemas:
    User:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        token:
          type: string
          description: Verification token (only for registration)
        businessId:
          type: string
          description: Business ID (only for OAuth login)
      required:
        - email
        - password


    Business:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ownerId:
          type: string
      required:
        - id

    BusinessUser:
      type: object
      properties:
        userId:
          type: string
        businessId:
          type: string
        role:
          type: string
          enum: [admin, user]
      required:
        - userId
        - businessId
        - role

    Verification:
      type: object
      properties:
        token:
          type: string
        email:
          type: string
        businessId:
          type: string
        verified:
          type: boolean
          description: Whether the email has been verified
        expiresAt:
          type: string
          format: date-time
          description: Expires after 48 hours
      required:
        - token
        - email
        - businessId
        - verified
        
    Invitation:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        sentByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Expires after 7 days
        accepted:
          type: boolean
          description: Whether the invitation has been accepted
      required:
        - id
        - businessId
        - email
        - role
        - sentByUserId
        - createdAt
        - expiresAt
        - accepted
        
    Invite:
      type: object
      deprecated: true
      description: Deprecated. Use Verification instead for email verification flows.
      properties:
        token:
          type: string
        email:
          type: string
        businessId:
          type: string
        claimed:
          type: boolean
          description: Whether the invitation has been claimed
        expires:
          type: string
          format: date-time
          description: Expires after 7 days
      required:
        - token
        - email
        - businessId

    SyncTask:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        provider:
          type: string
          enum: [local, s3, dropbox, google-drive, onedrive, sftp, network]
        folderId:
          type: string
        status:
          type: string
          enum: [queued, processing, completed, failed]
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - businessId
        - provider
        - folderId
        - status

    SyncHistoryEntry:
      type: object
      properties:
        taskId:
          type: string
        businessId:
          type: string
        status:
          type: string
          enum: [completed, failed, processing]
        fileCount:
          type: integer
        timestamp:
          type: string
          format: date-time
      required:
        - taskId
        - businessId
        - status
        - timestamp

    ChatRequest:
      type: object
      properties:
        prompt:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
      required:
        - prompt

    ChatResponse:
      type: object
      properties:
        response:
          type: string
      required:
        - response

    Conversation:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        userId:
          type: string
        timestamp:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
      required:
        - id
        - messages

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - role
        - content

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
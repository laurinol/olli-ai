quarkus.http.port=8080
quarkus.google.cloud.project-id=${QUARKUS_GOOGLE_CLOUD_PROJECT_ID}
quarkus.firestore.project-id=${FIRESTORE_PROJECT_ID}
quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${GOOGLE_CLIENT_ID}
quarkus.oidc.client-secret=${GOOGLE_CLIENT_SECRET}
quarkus.oidc.token.issuer=https://accounts.google.com
quarkus.oidc.application-type=service
quarkus.http.auth.permission.authenticated.paths=/auth/sync/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.category."pro.olli".level=DEBUG
aws.s3.access-key=${AWS_ACCESS_KEY:default-key}
aws.s3.secret-key=${AWS_SECRET_KEY:default-secret}

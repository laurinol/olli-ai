quarkus.http.port=8080
# Database Configuration
# Database provider: firestore or mongodb
database.provider=${DATABASE_PROVIDER:mongodb}

# Firestore Configuration
quarkus.google.cloud.project-id=${QUARKUS_GOOGLE_CLOUD_PROJECT_ID:olli-ai-dev}
quarkus.google.cloud.location=${QUARKUS_GOOGLE_CLOUD_LOCATION:us-west1}
quarkus.firestore.project-id=${FIRESTORE_PROJECT_ID:olli-ai-dev}

# MongoDB Configuration
quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://admin:password@localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:olli}
quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${GOOGLE_CLIENT_ID}
quarkus.oidc.client-secret=${GOOGLE_CLIENT_SECRET}
quarkus.oidc.token.issuer=https://accounts.google.com
quarkus.oidc.application-type=web-app
quarkus.oidc.redirect-path=/auth/google/callback
quarkus.http.auth.permission.authenticated.paths=/auth/sync/*,-/auth/sync/local
quarkus.http.auth.permission.authenticated.policy=authenticated
%dev.quarkus.http.auth.permission.authenticated.paths=/auth/sync/*
%dev.quarkus.http.auth.permission.authenticated.policy=permit
%dev.quarkus.oidc.enabled=false
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%X{traceId}] [%c{2.}] (%t) %s%e%n
quarkus.log.category."pro.olli".level=DEBUG
quarkus.log.category."org.mongodb".level=DEBUG

# File logging configuration
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=20
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%X{traceId}] [%X{businessId}] [%X{userId}] [%c{2.}] %s%e%n

# Add JSON formatting for production environments
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.pretty-print=false
%prod.quarkus.log.console.json.additional-field.app.value=olli-backend
%prod.quarkus.log.console.json.additional-field.environment.value=${ENV:prod}
aws.s3.access-key=${AWS_ACCESS_KEY:default-key}
aws.s3.secret-key=${AWS_SECRET_KEY:default-secret}

### Resilience
# Resilience Configuration
resilience.retry.max-retries=3
resilience.retry.delay-ms=1000
resilience.timeout.default-ms=5000
resilience.circuit-breaker.request-volume-threshold=20
resilience.circuit-breaker.failure-ratio=0.5
resilience.circuit-breaker.delay-ms=30000

# Metrics and health
quarkus.smallrye-metrics.enabled=true
quarkus.smallrye-metrics.jaxrs.enabled=true

# Enable Prometheus metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.registry-enabled-default=true

# Enable health checks and UI
quarkus.health.extensions.enabled=true
quarkus.health.openapi.included=true
quarkus.health.check.timeout=10s
quarkus.smallrye-health.ui.enable=true
quarkus.smallrye-health.root-path=/health

# Set up custom MetricsFactory for MicroProfile Metrics
quarkus.arc.selected-alternatives=pro.olli.core.metrics.PerformanceMetrics

# Enable Timed interceptor
quarkus.interceptors.enabled=true

# OpenTelemetry Configuration
quarkus.application.name=olli-backend
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.tracer.enabled=true

# Use resource attributes to identify this service
quarkus.opentelemetry.resource.attributes=service.name=olli-backend,service.version=${quarkus.application.version:unknown},deployment.environment=${ENV:dev}

# Jaeger Exporter Configuration
quarkus.opentelemetry.tracer.exporter.jaeger.endpoint=${JAEGER_ENDPOINT:http://localhost:14250}

# OTLP Exporter Configuration (for other collectors)
quarkus.opentelemetry.tracer.exporter.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4317}

# Trace sampling (1.0 = 100% of requests, 0.1 = 10% of requests)
quarkus.opentelemetry.tracer.sampler=ratio
quarkus.opentelemetry.tracer.sampler.ratio=1.0
%prod.quarkus.opentelemetry.tracer.sampler.ratio=0.1

### Queue
# Default: Google Cloud Tasks
queue.provider=google
gcp.project-id=olli-ai
queue.name=sync-tasks
rabbitmq.queue=sync-queue
# Dev: RabbitMQ
%dev.queue.provider=rabbitmq
%dev.rabbitmq.host=localhost
%dev.rabbitmq.port=5672
%dev.rabbitmq.username=admin
%dev.rabbitmq.password=pass123

### Worker Configuration
# Backoff strategy for polling queues
worker.backoff.initial-ms=1000
worker.backoff.max-ms=60000
worker.backoff.multiplier=1.5
# Lower values for development environment
%dev.worker.backoff.initial-ms=500
%dev.worker.backoff.max-ms=30000

### AI
# Default: Vertex AI
ai.provider=vertex
gcp.vertex.location=us-west1
gcp.vertex.model=text-embedding-004

# Dev: Ollama
%dev.ai.provider=ollama
%dev.ollama.endpoint=http://localhost:11434

### Billing
# Billing system configuration
billing.enabled=false
%prod.billing.enabled=true
payment.provider=stripe

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY}
%prod.stripe.api.key=${STRIPE_API_KEY}

# Stripe Price IDs
stripe.price.basic=${STRIPE_PRICE_BASIC:price_basic}
stripe.price.professional=${STRIPE_PRICE_PROFESSIONAL:price_professional}
stripe.price.enterprise=${STRIPE_PRICE_ENTERPRISE:price_enterprise}

# Webhook secret for Stripe events
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
%prod.stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Webhook URL for Stripe events
stripe.webhook.url=${STRIPE_WEBHOOK_URL:}
%prod.stripe.webhook.url=${STRIPE_WEBHOOK_URL}

# Auto-register Stripe webhooks on application startup
stripe.webhook.auto-register=false
%prod.stripe.webhook.auto-register=${STRIPE_WEBHOOK_AUTO_REGISTER:false}

# Default Stripe test/development keys
%dev.stripe.api.key=sk_test_example123secretkey
%dev.stripe.webhook.secret=whsec_example123webhooksecret
%dev.stripe.webhook.url=https://your-ngrok-url.ngrok-free.app/billing/webhook
%dev.stripe.webhook.auto-register=false
%dev.stripe.price.basic=price_basic123
%dev.stripe.price.professional=price_professional123
%dev.stripe.price.enterprise=price_enterprise123

### OAuth
quarkus.oidc.google.client-id=YOUR_GOOGLE_CLIENT_ID
quarkus.oidc.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
quarkus.oidc.google.auth-server-url=https://accounts.google.com
quarkus.oidc.google.redirect-uri=http://localhost:8080/auth/google/callback

quarkus.oidc.facebook.client-id=YOUR_FB_APP_ID
quarkus.oidc.facebook.client-secret=YOUR_FB_APP_SECRET
quarkus.oidc.facebook.auth-server-url=https://graph.facebook.com
quarkus.oidc.facebook.redirect-uri=http://localhost:8080/auth/facebook/callback

quarkus.oidc.microsoft.client-id=YOUR_MS_CLIENT_ID
quarkus.oidc.microsoft.client-secret=YOUR_MS_CLIENT_SECRET
quarkus.oidc.microsoft.auth-server-url=https://login.microsoftonline.com/common
quarkus.oidc.microsoft.redirect-uri=http://localhost:8080/auth/microsoft/callback

# X requires custom handling (OAuth 1.0a or API key flow)
x.api-key=YOUR_X_API_KEY
x.api-secret=YOUR_X_API_SECRET
x.redirect-uri=http://localhost:8080/auth/x/callback

# JWT for session
quarkus.smallrye-jwt.sign.key=YOUR_JWT_SECRET

### Mailer
# Dev
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.mock=true
app.domain=http://localhost:8080

# Prod (e.g., Gmail SMTP)
# quarkus.mailer.host=smtp.gmail.com
# quarkus.mailer.port=587
# quarkus.mailer.username=your-email@gmail.com
# quarkus.mailer.password=your-app-password
# quarkus.mailer.start-tls=REQUIRED
# app.domain=https://yourapp.com

app.worker.multiplier=1
%dev.app.worker.multiplier=1
%stage.app.worker.multiplier=4
%prod.app.worker.multiplier=8

# Development environment specific configuration

# Dev mode authentication
quarkus.security.auth.enabled=true
quarkus.http.auth.enabled=true
quarkus.arc.selected-alternatives=pro.olli.auth.DevJwtAuthMechanism
app.dev.mode=true
quarkus.container-image.build=false

# Special paths that don't require authentication in dev mode
quarkus.http.auth.permission.public.paths=/chat/test-query,/test-integration/*,/auth/sync/local,/auth/login
quarkus.http.auth.permission.public.policy=permit

# Paths that need authentication
quarkus.http.auth.permission.authenticated.paths=/chat/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.oidc.enabled=false

# Logging
quarkus.log.category."pro.olli".level=DEBUG
quarkus.log.category."org.mongodb".level=DEBUG

# Dev mode MongoDB connection
quarkus.mongodb.connection-string=mongodb://admin:password@localhost:27017
quarkus.mongodb.database=olli

# AI provider configuration
ollama.endpoint=http://localhost:11434
ollama.embedding.model=tinyllama
ollama.embedding.dimension=768
ollama.chat.model=tinyllama

# Timeouts
ollama.connection.timeout.seconds=60

# Using direct Ollama implementation

# Queue configuration
queue.provider=rabbitmq
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=admin
rabbitmq.password=pass123

# Lower backoff for development environment
worker.backoff.initial-ms=500
worker.backoff.max-ms=30000

# Mock mail in dev mode
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.mock=true
app.domain=http://localhost:8080
